name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Vidigal-code/skillslink'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run format:check && npm run lint && npm run typecheck && npm test

      - name: Read the current npm release
        id: latest
        run: echo "version=$(npm view @vidigal-code/skillslink version)" >> "$GITHUB_OUTPUT"

      - name: Assign stable release version
        env:
          NPM_LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: npm run release:version

      - name: Build package
        run: npm run build:package

      - name: Inspect package contents
        run: npm run pack:check

      - name: Publish package with provenance
        run: npm publish --workspace @vidigal-code/skillslink --access public
